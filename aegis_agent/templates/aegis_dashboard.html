<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AegisAgent Dashboard</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, sans-serif;
        background: #08121d;
        color: #edf6ff;
      }
      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 24px;
      }
      .panel {
        background: rgba(17, 25, 39, 0.85);
        border: 1px solid #19314d;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 20px;
      }
      .agents {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
      }
      .card {
        background: rgba(22, 34, 52, 0.9);
        border: 1px solid #23466e;
        border-radius: 12px;
        padding: 16px;
      }
      .status {
        color: #72f0b6;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <h1>AegisAgent AI</h1>
        <p id="project-name">Connecting telemetry...</p>
      </div>
      <div class="panel">
        <h2>Live Agent Telemetry</h2>
        <div id="agents" class="agents"></div>
      </div>
    </div>

    <script src="/static/js/aegis_dashboard.js"></script>
  </body>
</html>
