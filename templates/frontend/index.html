<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal AI Assistant</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 12px;
    }

    h2 {
      font-size: 22px;
      margin: 0 0 12px;
    }

    p {
      color: #6b7280;
      line-height: 1.5;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 16px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #111827;
      color: white;
      font-size: 18px;
      margin-top: 12px;
    }

    .secondary {
      background: #374151;
    }

    .danger {
      background: #991b1b;
    }

    .result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #f3f4f6;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .status {
      font-weight: bold;
      color: #16a34a;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="card">
      <h1>Personal AI Assistant</h1>
      <p>Frontend connected to Flask backend.</p>
      <p>Status: <span id="loginStatus" class="status">Not logged in</span></p>

      <button onclick="checkHealth()">Test Backend Health</button>
      <button onclick="loadAppInfo()">Load App Info</button>

      <div id="result" class="result">Result will appear here...</div>
    </div>

    <div class="card">
      <h2>Account</h2>

      <input id="name" placeholder="Name / Username" />
      <input id="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />

      <button onclick="signUp()">Sign Up</button>
      <button class="secondary" onclick="logIn()">Log In</button>
      <button class="danger" onclick="logOut()">Log Out</button>
    </div>

    <div class="card">
      <h2>Tasks</h2>

      <input id="taskTitle" placeholder="Task title" />
      <textarea id="taskDescription" placeholder="Task description"></textarea>

      <button onclick="createTask()">Create Task</button>
      <button class="secondary" onclick="loadTasks()">Load Tasks</button>

      <div id="tasksResult" class="result">No tasks loaded yet...</div>
    </div>
  </div>

  <script>
    function getToken() {
      return localStorage.getItem("auth_token");
    }

    function setToken(token) {
      localStorage.setItem("auth_token", token);
      updateLoginStatus();
    }

    function clearToken() {
      localStorage.removeItem("auth_token");
      updateLoginStatus();
    }

    function updateLoginStatus() {
      const token = getToken();
      document.getElementById("loginStatus").textContent = token ? "Logged in" : "Not logged in";
    }

    function showResult(data) {
      document.getElementById("result").textContent = JSON.stringify(data, null, 2);
    }

    function showTasks(data) {
      document.getElementById("tasksResult").textContent = JSON.stringify(data, null, 2);
    }

    async function checkHealth() {
      try {
        const response = await fetch("/health");
        const data = await response.json();
        showResult(data);
      } catch (error) {
        showResult({ status: "error", message: error.message });
      }
    }

    async function loadAppInfo() {
      try {
        const response = await fetch("/app-info");
        const data = await response.json();
        showResult(data);
      } catch (error) {
        showResult({ status: "error", message: error.message });
      }
    }

    async function signUp() {
      try {
        const response = await fetch("/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (data.status === "success" && data.user && data.user.auth_token) {
          setToken(data.user.auth_token);
        }

        showResult(data);
      } catch (error) {
        showResult({ status: "error", message: error.message });
      }
    }

    async function logIn() {
      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (data.status === "success" && data.user && data.user.auth_token) {
          setToken(data.user.auth_token);
        }

        showResult(data);
      } catch (error) {
        showResult({ status: "error", message: error.message });
      }
    }

    async function logOut() {
      try {
        const token = getToken();

        if (!token) {
          showResult({ status: "error", message: "No token found" });
          return;
        }

        const response = await fetch("/logout", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token
          }
        });

        const data = await response.json();
        clearToken();
        showResult(data);
      } catch (error) {
        showResult({ status: "error", message: error.message });
      }
    }

    async function createTask() {
      try {
        const token = getToken();

        if (!token) {
          showTasks({ status: "error", message: "Please log in first" });
          return;
        }

        const response = await fetch("/tasks", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({
            title: document.getElementById("taskTitle").value,
            description: document.getElementById("taskDescription").value
          })
        });

        const data = await response.json();
        showTasks(data);
      } catch (error) {
        showTasks({ status: "error", message: error.message });
      }
    }

    async function loadTasks() {
      try {
        const token = getToken();

        if (!token) {
          showTasks({ status: "error", message: "Please log in first" });
          return;
        }

        const response = await fetch("/tasks", {
          method: "GET",
          headers: {
            "Authorization": "Bearer " + token
          }
        });

        const data = await response.json();
        showTasks(data);
      } catch (error) {
        showTasks({ status: "error", message: error.message });
      }
    }

    updateLoginStatus();
  </script>
</body>
</html>
