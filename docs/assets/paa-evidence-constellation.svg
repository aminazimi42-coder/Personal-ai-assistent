<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t d">
<title id="t">Personal AI Assistant — evidence constellation</title>
<desc id="d">Evidence constellation from capture through retrieve, understand, plan, act, verify, remember</desc>
<defs>
<linearGradient id="ebg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b18"/><stop offset=".5" stop-color="#0b1735"/><stop offset="1" stop-color="#190c35"/></linearGradient>
<linearGradient id="el" x1="0" x2="1"><stop stop-color="#49e7ff"/><stop offset="1" stop-color="#a77dff"/></linearGradient>
</defs>
<rect width="1200" height="200" rx="18" fill="url(#ebg)"/>
<g font-family="Arial" text-anchor="middle">
<g transform="translate(120 100)"><circle r="30" fill="#08233b" stroke="#52f4ff" stroke-width="1.5"/><text y="-2" fill="#6cf0ff" font-size="11" font-weight="700">CAPTURE</text><text y="14" fill="#d2e3f7" font-size="9">voice/text</text></g>
<g transform="translate(310 100)"><circle r="30" fill="#0b2145" stroke="#4d8dff" stroke-width="1.5"/><text y="-2" fill="#78caff" font-size="11" font-weight="700">RETRIEVE</text><text y="14" fill="#d2e3f7" font-size="9">search</text></g>
<g transform="translate(500 100)"><circle r="30" fill="#0c2248" stroke="#5b7eff" stroke-width="1.5"/><text y="-2" fill="#8fc0ff" font-size="11" font-weight="700">UNDERSTAND</text><text y="14" fill="#d2e3f7" font-size="9">intent</text></g>
<g transform="translate(690 100)"><circle r="30" fill="#1a1844" stroke="#8b6cff" stroke-width="1.5"/><text y="-2" fill="#a88fff" font-size="11" font-weight="700">PLAN</text><text y="14" fill="#d2e3f7" font-size="9">action</text></g>
<g transform="translate(880 100)"><circle r="30" fill="#221640" stroke="#9c5eff" stroke-width="1.5"/><text y="-2" fill="#c08fff" font-size="11" font-weight="700">ACT</text><text y="14" fill="#d2e3f7" font-size="9">execute</text></g>
<g transform="translate(1070 100)"><circle r="30" fill="#2a1240" stroke="#b55eff" stroke-width="1.5"/><text y="-2" fill="#d4a0ff" font-size="11" font-weight="700">VERIFY</text><text y="14" fill="#d2e3f7" font-size="9">evidence</text></g>
</g>
<path d="M150 100H1040" stroke="url(#el)" stroke-width="3" opacity=".4"/>
<circle r="4" fill="#fff"><animateMotion dur="5s" repeatCount="indefinite" path="M150 100H1040"/></circle>
<text x="600" y="34" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15" font-weight="800">EVIDENCE CONSTELLATION</text>
<text x="600" y="170" text-anchor="middle" fill="#ff9fb8" font-family="Arial" font-size="11" font-weight="700">EVERY RESULT GROUNDED IN VERIFIED EVIDENCE</text>
</svg>
