<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">Personal AI Assistant — cinematic hero</title>
<desc id="d">Cinematic hero visual for Personal AI Assistant showing the pipeline from capture to memory</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020714"/><stop offset=".48" stop-color="#071c3d"/><stop offset="1" stop-color="#0d1a3d"/></linearGradient>
<linearGradient id="neon" x1="0" x2="1"><stop stop-color="#52f4ff"/><stop offset=".52" stop-color="#4d8dff"/><stop offset="1" stop-color="#bd6cff"/></linearGradient>
<linearGradient id="warm" x1="0" x2="1"><stop stop-color="#ff9a62"/><stop offset="1" stop-color="#ff5e8a"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" rx="20" fill="url(#bg)"/>
<!-- Central orb -->
<circle cx="600" cy="210" r="70" fill="#071c3d" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)"/>
<text x="600" y="200" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="800">AI</text>
<text x="600" y="225" text-anchor="middle" fill="#9fd4ff" font-family="Arial" font-size="13">ASSISTANT</text>
<!-- Pipeline nodes -->
<g font-family="Arial" text-anchor="middle">
<g transform="translate(140 210)"><circle r="44" fill="#08233b" stroke="#52f4ff" stroke-width="2"/><text y="-4" fill="#6cf0ff" font-size="13" font-weight="700">CAPTURE</text><text y="14" fill="#d2e3f7" font-size="11">voice/text</text></g>
<g transform="translate(330 210)"><circle r="44" fill="#0b2145" stroke="#4d8dff" stroke-width="2"/><text y="-4" fill="#7eb5ff" font-size="13" font-weight="700">RETRIEVE</text><text y="14" fill="#d2e3f7" font-size="11">knowledge</text></g>
<g transform="translate(520 210)"><circle r="44" fill="#0c2248" stroke="#5b7eff" stroke-width="2"/><text y="-4" fill="#8fc0ff" font-size="13" font-weight="700">UNDERSTAND</text><text y="14" fill="#d2e3f7" font-size="11">intent</text></g>
<g transform="translate(690 210)"><circle r="44" fill="#1a1844" stroke="#8b6cff" stroke-width="2"/><text y="-4" fill="#a88fff" font-size="13" font-weight="700">PLAN</text><text y="14" fill="#d2e3f7" font-size="11">action</text></g>
<g transform="translate(860 210)"><circle r="44" fill="#221640" stroke="#9c5eff" stroke-width="2"/><text y="-4" fill="#c08fff" font-size="13" font-weight="700">ACT</text><text y="14" fill="#d2e3f7" font-size="11">execute</text></g>
<g transform="translate(1030 210)"><circle r="44" fill="#2a1240" stroke="#b55eff" stroke-width="2"/><text y="-4" fill="#d4a0ff" font-size="13" font-weight="700">VERIFY</text><text y="14" fill="#d2e3f7" font-size="11">evidence</text></g>
</g>
<!-- Connecting path -->
<path d="M184 210H986" stroke="url(#neon)" stroke-width="3" opacity=".5"/>
<!-- Animated dot -->
<circle r="4" fill="#fff"><animateMotion dur="6s" repeatCount="indefinite" path="M184 210H986"/></circle>
<!-- Top label -->
<text x="600" y="48" text-anchor="middle" fill="#fff" font-family="Arial" font-size="26" font-weight="800">PERSONAL AI ASSISTANT</text>
<text x="600" y="76" text-anchor="middle" fill="#93a9ca" font-family="Arial" font-size="14" letter-spacing="2">CAPTURE → RETRIEVE → UNDERSTAND → PLAN → ACT → VERIFY → REMEMBER</text>
<!-- Bottom accent -->
<text x="600" y="372" text-anchor="middle" fill="#ff9a62" font-family="Arial" font-size="13" font-weight="700">PRODUCTION-GRADE · SECURITY-HARDENED · AI-NATIVE · MULTI-TENANT SaaS</text>
</svg>
