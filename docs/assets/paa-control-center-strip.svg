<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
<title id="t">Personal AI Assistant — control center snapshot</title>
<desc id="d">System snapshot showing verified metrics: live app, API, tests, coverage, AI, retrieval, memory, agents, automation, security</desc>
<defs>
<linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020817"/><stop offset=".5" stop-color="#071b3b"/><stop offset="1" stop-color="#0d1840"/></linearGradient>
<linearGradient id="cg" x1="0" x2="1"><stop stop-color="#49e7ff"/><stop offset="1" stop-color="#a86cff"/></linearGradient>
</defs>
<rect width="1200" height="280" rx="20" fill="url(#cbg)"/>
<text x="600" y="36" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18" font-weight="800" letter-spacing="2">CONTROL CENTER SNAPSHOT</text>
<text x="600" y="56" text-anchor="middle" fill="#93a9ca" font-family="Arial" font-size="11">Verified values from live system state — not fabricated</text>
