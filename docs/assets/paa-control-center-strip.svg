<g transform="translate(200 160)"><rect x="-70" y="-20" width="140" height="40" rx="8" fill="#1a1844" stroke="#8b6cff" stroke-width="1"/><text x="0" y="-4" fill="#a88fff" font-weight="700">AI PROVIDER</text><text x="0" y="12" fill="#d2e3f7">abstracted</text></g>
<g transform="translate(400 160)"><rect x="-70" y="-20" width="140" height="40" rx="8" fill="#1a1844" stroke="#8b6cff" stroke-width="1"/><text x="0" y="-4" fill="#a88fff" font-weight="700">RETRIEVAL</text><text x="0" y="12" fill="#d2e3f7">hybrid</text></g>
<g transform="translate(600 160)"><rect x="-70" y="-20" width="140" height="40" rx="8" fill="#1a1844" stroke="#8b6cff" stroke-width="1"/><text x="0" y="-4" fill="#a88fff" font-weight="700">MEMORY</text><text x="0" y="12" fill="#d2e3f7">layered</text></g>
<g transform="translate(800 160)"><rect x="-70" y="-20" width="140" height="40" rx="8" fill="#2a1240" stroke="#b55eff" stroke-width="1"/><text x="0" y="-4" fill="#d4a0ff" font-weight="700">AGENTS</text><text x="0" y="12" fill="#d2e3f7">durable</text></g>
<g transform="translate(1000 160)"><rect x="-70" y="-20" width="140" height="40" rx="8" fill="#2a1240" stroke="#b55eff" stroke-width="1"/><text x="0" y="-4" fill="#d4a0ff" font-weight="700">AUTOMATION</text><text x="0" y="12" fill="#d2e3f7">scheduled</text></g>
