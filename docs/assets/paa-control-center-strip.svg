<g transform="translate(800 100)"><rect x="-70" y="-20" width="140" height="40" rx="8" fill="#0b2145" stroke="#4d8dff" stroke-width="1"/><text x="0" y="-4" fill="#7eb5ff" font-weight="700">SECURITY</text><text x="0" y="12" fill="#d2e3f7">hardened</text></g>
