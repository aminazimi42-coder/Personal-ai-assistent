<path d="M100 230H1100" stroke="url(#cg)" stroke-width="2" opacity=".4"/>
<text x="600" y="252" text-anchor="middle" fill="#ff9a62" font-family="Arial" font-size="11" font-weight="700">REAL METRICS FROM REAL SERVICE STATE — NOT A STATIC MOCK</text>
