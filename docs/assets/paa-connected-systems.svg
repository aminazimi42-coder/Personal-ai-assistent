<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">Personal AI Assistant — connected systems</title>
<desc id="d">Visual story of connected systems: User → Workspace → Knowledge → Memory → AI → Tools → Action → Verification</desc>
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b18"/><stop offset=".5" stop-color="#0b1735"/><stop offset="1" stop-color="#0d1840"/></linearGradient>
<linearGradient id="lnk" x1="0" x2="1"><stop stop-color="#49e7ff"/><stop offset="1" stop-color="#a77dff"/></linearGradient>
</defs>
<rect width="1200" height="340" rx="20" fill="url(#bg2)"/>
<!-- 8 nodes in a flowing path -->
<g font-family="Arial" text-anchor="middle">
<g transform="translate(130 170)"><rect x="-50" y="-28" width="100" height="56" rx="12" fill="#08233b" stroke="#52f4ff" stroke-width="1.5"/><text y="-4" fill="#6cf0ff" font-size="12" font-weight="700">USER</text><text y="14" fill="#d2e3f7" font-size="10">identity</text></g>
<g transform="translate(280 170)"><rect x="-50" y="-28" width="100" height="56" rx="12" fill="#0b2145" stroke="#4d8dff" stroke-width="1.5"/><text y="-4" fill="#7eb5ff" font-size="12" font-weight="700">WORKSPACE</text><text y="14" fill="#d2e3f7" font-size="10">projects</text></g>
<g transform="translate(430 170)"><rect x="-50" y="-28" width="100" height="56" rx="12" fill="#0c2248" stroke="#5b7eff" stroke-width="1.5"/><text y="-4" fill="#8fc0ff" font-size="12" font-weight="700">KNOWLEDGE</text><text y="14" fill="#d2e3f7" font-size="10">retrieval</text></g>
<g transform="translate(580 170)"><rect x="-50" y="-28" width="100" height="56" rx="12" fill="#1a1844" stroke="#7b6cff" stroke-width="1.5"/><text y="-4" fill="#a88fff" font-size="12" font-weight="700">MEMORY</text><text y="14" fill="#d2e3f7" font-size="10">layers</text></g>
<g transform="translate(730 170)"><rect x="-50" y="-28" width="100" height="56" rx="12" fill="#1e1640" stroke="#8b6cff" stroke-width="1.5"/><text y="-4" fill="#b88fff" font-size="12" font-weight="700">AI</text><text y="14" fill="#d2e3f7" font-size="10">provider</text></g>
<g transform="translate(880 170)"><rect x="-50" y="-28" width="100" height="56" rx="12" fill="#221640" stroke="#9c5eff" stroke-width="1.5"/><text y="-4" fill="#c08fff" font-size="12" font-weight="700">TOOLS</text><text y="14" fill="#d2e3f7" font-size="10">gateway</text></g>
<g transform="translate(1030 170)"><rect x="-50" y="-28" width="100" height="56" rx="12" fill="#2a1240" stroke="#b55eff" stroke-width="1.5"/><text y="-4" fill="#d4a0ff" font-size="12" font-weight="700">ACTION</text><text y="14" fill="#d2e3f7" font-size="10">execute</text></g>
</g>
<!-- Arrows -->
<g stroke="url(#lnk)" stroke-width="2" opacity=".5" fill="none">
<path d="M180 170H230M330 170H380M480 170H530M630 170H680M780 170H830M930 170H980"/>
</g>
<!-- Verification checkmark -->
<g transform="translate(1100 170)"><circle r="36" fill="#0a2820" stroke="#3ee8a0" stroke-width="2"/><path d="M-12 0L0 12L16 -10" stroke="#3ee8a0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="1100" y="200" text-anchor="middle" fill="#3ee8a0" font-family="Arial" font-size="10" font-weight="700">VERIFIED</text>
<!-- Title -->
<text x="600" y="40" text-anchor="middle" fill="#fff" font-family="Arial" font-size="20" font-weight="800">CONNECTED SYSTEMS</text>
<text x="600" y="62" text-anchor="middle" fill="#93a9ca" font-family="Arial" font-size="12" letter-spacing="1">User → Workspace → Knowledge → Memory → AI → Tools → Action → Verification</text>
<!-- Bottom -->
<text x="600" y="290" text-anchor="middle" fill="#ff9a62" font-family="Arial" font-size="11" font-weight="700">EVERY ACTION VERIFIED · EVERY TOOL PERMISSIONED · EVERY TENANT ISOLATED</text>
</svg>
