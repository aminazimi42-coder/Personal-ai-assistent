<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="t d"><title id="t">Bob engineering agent workflow</title><desc id="d">Bounded engineering copilot workflow</desc><defs><linearGradient id="b"><stop stop-color="#050b18"/><stop offset=".5" stop-color="#0b1735"/><stop offset="1" stop-color="#190c35"/></linearGradient><linearGradient id="l"><stop stop-color="#49e7ff"/><stop offset="1" stop-color="#a77dff"/></linearGradient></defs><rect width="1440" height="430" rx="26" fill="url(#b)"/><text x="720" y="58" text-anchor="middle" fill="#fff" font-family="Arial" font-size="30" font-weight="800">BOB • BOUNDED ENGINEERING COPILOT</text><text x="720" y="88" text-anchor="middle" fill="#93a9ca" font-family="Arial" font-size="15" letter-spacing="2">HUMAN INTENT → IMPLEMENTATION → VERIFICATION → EVIDENCE</text><path d="M180 220H1260" stroke="url(#l)" stroke-width="4" opacity=".6"/><g font-family="Arial" text-anchor="middle"><g transform="translate(180 220)"><circle r="68" fill="#08233b" stroke="#53e6ff" stroke-width="2"/><text y="-8" fill="#6cf0ff" font-size="16" font-weight="700">HUMAN</text><text y="18" fill="#d2e3f7" font-size="14">scope &amp; authority</text></g><g transform="translate(540 220)"><circle r="68" fill="#102145" stroke="#58bbff" stroke-width="2"/><text y="-8" fill="#78caff" font-size="16" font-weight="700">BOB</text><text y="18" fill="#d2e3f7" font-size="14">engineering copilot</text></g><g transform="translate(900 220)"><circle r="68" fill="#181a48" stroke="#927cff" stroke-width="2"/><text y="-8" fill="#b09aff" font-size="16" font-weight="700">GATES</text><text y="18" fill="#ded7f7" font-size="14">tests &amp; review</text></g><g transform="translate(1260 220)"><circle r="68" fill="#24163e" stroke="#c276ff" stroke-width="2"/><text y="-8" fill="#d6a0ff" font-size="16" font-weight="700">EVIDENCE</text><text y="18" fill="#eadcf7" font-size="14">commit &amp; audit</text></g></g><circle r="5" fill="#fff"